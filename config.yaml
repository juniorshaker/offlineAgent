# =============================================================================
# OfflineAgent Configuration
# =============================================================================

llm:
  # Which backend to use: "primary" or "secondary"
  active: primary

  # Primary backend (your existing internal API, no auth) — KEPT AS-IS
  primary:
    url: "http://your-internal-api/v1/chat/completions"
    model: "Qwen3"
    timeout: 300
    api_key: ""

  # Secondary backend (OpenAI-compatible API with token auth)
  secondary:
    url: "https://api.openai.com/v1/chat/completions"
    model: "gpt-4"
    timeout: 120
    api_key: "sk-your-api-key-here"

skills:
  paths:
    - "./skills"
    - "~/.codex/skills"
    - "~/.openclaw/skills"
  preprocessing:
    template_vars: true
    inline_shell: false

agent:
  max_history: 20
  max_tokens_estimate: 128000
  tool_budget_ratio: 0.9
  cycle_detection: true
  max_tool_iterations: 50
  system_prompt_extra: ""


  # Skill auto-injection via keyword pre-filter + LLM final pick
  skill_injection:
    enabled: true
    llm_selection: true        # When 2+ candidates, use LLM to pick best
    llm_selection_timeout: 15   # seconds for the tiny selection call
  compression:
    enabled: true
    trigger_ratio: 0.7
    keep_recent: 2

  error_recovery:
    enabled: true
    max_retries: 2
    retry_delay: 2

  topic_guard:
    enabled: true
    check_interval: 1

  memory:
    enabled: true
    max_recent: 3
    auto_summarize_on_exit: true

  feedback:
    enabled: true

tools:
  enabled:
    - read_file
    - write_file
    - list_dir
    - search_code
    - find_files
    - shell
    - read_template
    - write_output
    - web_fetch
    - write_docx
    - write_xlsx
    - write_pptx
    - browser_navigate
    - browser_screenshot
    - browser_click
    - browser_type
    - browser_get_content
    - browser_get_html
    - browser_exec
    - browser_status
    - db_connect
    - db_list_procedures
    - db_get_procedure
    - db_list_tables
    - db_query
    - db_status
    - db_disconnect
  shell:
    allowed:
      - mvn
      - javac
      - java
      - git
      - python
      - pip
      - npm
      - docker
      - ssh
      - scp
    require_confirm: true
  file_write:
    require_confirm: true
  browser:
    enabled: true
    engine: playwright
    headless: true
    browsers_path: "./browsers"
    viewport_width: 1280
    viewport_height: 720
    navigation_timeout: 30000
    screenshot_on_error: true

server:
  host: "0.0.0.0"
  port: 8999

logging:
  dir: "./log"
  level: "INFO"
  max_log_files: 7
  console: true
  file: true

# =============================================================================
# Skill keyword mapping (pre-filter for auto-injection)
# When user input matches a keyword, the corresponding skill becomes a candidate.
# If multiple candidates match, LLM picks the best one.
# =============================================================================
