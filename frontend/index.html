<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OfflineAgent</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2358a6ff'/><text x='5' y='23' font-size='20' font-weight='bold' fill='white'>OA</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="app">
  <div class="sidebar-overlay"></div>

  <!-- Sidebar with 5 tab panels -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-tabs">
      <button class="sidebar-tab active" data-tab="files" title="Files">Files</button>
      <button class="sidebar-tab" data-tab="history" title="History">History</button>
      <button class="sidebar-tab" data-tab="tokens" title="Tokens">Tokens</button>
      <button class="sidebar-tab" data-tab="skills" title="Skills">Skills</button>
      <button class="sidebar-tab" data-tab="search" title="Search">Search</button>
    </div>
    <button class="btn-icon sidebar-close-btn" id="btn-sidebar-close" title="Close">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>

    <!-- Files Panel -->
    <div class="sidebar-panel active" id="panel-files">
      <div class="sidebar-breadcrumb" id="sidebar-breadcrumb"></div>
      <div class="sidebar-list" id="sidebar-list"></div>
      <div class="sidebar-preview" id="sidebar-preview">
        <div class="preview-header"><span id="preview-title">Preview</span><button class="btn-icon" id="btn-preview-close" title="Close" style="width:22px;height:22px">&times;</button></div>
        <div class="preview-content" id="preview-content"></div>
      </div>
    </div>

    <!-- History Panel -->
    <div class="sidebar-panel" id="panel-history">
      <div class="history-list" id="history-list">
        <div class="history-empty">Loading...</div>
      </div>
    </div>

    <!-- Tokens Panel -->
    <div class="sidebar-panel" id="panel-tokens">
      <div class="token-controls">
        <select id="token-backend" class="token-select">
          <option value="">All backends</option>
        </select>
        <select id="token-model" class="token-select">
          <option value="">All models</option>
        </select>
        <select id="token-range" class="token-select">
          <option value="hour">Hour</option>
          <option value="day">Day</option>
          <option value="week" selected>Week</option>
          <option value="month">Month</option>
        </select>
      </div>
      <div class="token-summary" id="token-summary">
        <div class="token-card"><span class="tc-label">Total Tokens</span><span class="tc-value" id="tc-total">0</span></div>
        <div class="token-card"><span class="tc-label">Prompt</span><span class="tc-value" id="tc-prompt">0</span></div>
        <div class="token-card"><span class="tc-label">Completion</span><span class="tc-value" id="tc-completion">0</span></div>
        <div class="token-card"><span class="tc-label">API Calls</span><span class="tc-value" id="tc-calls">0</span></div>
      </div>
      <div class="token-charts">
        <div class="token-chart-wrap"><canvas id="chart-bar"></canvas></div>
        <div class="token-chart-wrap"><canvas id="chart-line"></canvas></div>
      </div>
    </div>

    <!-- Skills Panel -->
    <div class="sidebar-panel" id="panel-skills">
      <div class="skills-count" id="skills-count">0 skills loaded</div>
      <div class="skills-list" id="skills-list"></div>
    </div>

    <!-- Search Panel -->
    <div class="sidebar-panel" id="panel-search">
      <div class="search-input-wrap">
        <input type="text" id="search-input" class="search-input" placeholder="Search conversations...">
      </div>
      <div class="search-results" id="search-results">
        <div class="search-empty">Enter a keyword to search</div>
      </div>
    </div>
  </aside>

  <!-- Main chat area -->
  <div class="main-panel">
    <!-- Echo mode warning banner (hidden by default) -->
    <div class="echo-banner" id="echo-banner" style="display:none">
      <span class="echo-banner-icon">⚠️</span>
      <span class="echo-banner-text">LLM API 未连接 — 运行在 Echo Mode，工具和文件生成均不可用。请检查 config.yaml 中的 llm.primary.url</span>
    </div>
    <header id="header">
      <div class="header-left">
        <button class="btn-icon" id="btn-files" title="Toggle sidebar">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
        </button>
        <span class="model-pill" id="model-name">--</span>
        <span class="status-dot" id="status-dot" title="idle"></span>
      </div>
      <div class="header-right">
        <button class="btn-icon" id="btn-new-chat" title="New conversation">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="btn-icon" id="btn-clear" title="Clear history">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
        </button>
      </div>
    </header>

    <main id="chat">
      <div id="messages">
        <div class="message system welcome">
          <div class="welcome-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          </div>
          <div class="welcome-text">
            <strong>OfflineAgent</strong>
            <span>Ready. Type /help for commands</span>
          </div>
        </div>
      </div>
    </main>

    <footer id="input-area">
      <div id="upload-chips" class="upload-preview-bar"></div>
      <div class="input-wrapper">
        <textarea id="user-input" placeholder="Send a message..." rows="1" autofocus></textarea>
        <div class="input-actions">
          <input type="file" id="file-input" multiple hidden
            accept=".jpg,.jpeg,.png,.gif,.webp,.bmp,.svg,.ico,.txt,.sql,.md,.py,.js,.ts,.jsx,.tsx,.json,.xml,.yaml,.yml,.toml,.ini,.cfg,.conf,.csv,.log,.html,.css,.scss,.less,.java,.kt,.swift,.rs,.go,.c,.cpp,.h,.hpp,.sh,.bat,.ps1,.rb,.php,.lua,.r,.m,.env,.gitignore,.docx,.xlsx,.pptx,.pdf">
          <button class="btn-icon btn-attach" id="btn-attach" title="Attach file">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <button id="btn-send" class="btn-send" title="Send">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
          <button id="btn-stop" class="btn-stop" title="Stop" hidden>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
          </button>
        </div>
      </div>
      <div class="input-hint">Ctrl+L clear &middot; /help for commands</div>
    </footer>
  </div>
</div>

<script src="/vendor/chart.umd.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
